[project]
name = "bearing-faults-prediction"
version = "0.1.0"
description = "Predictive maintenance for motor bearings using ML on motor current signals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Marwane Zerbaoui"}
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "joblib>=1.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pre-commit>=3.8",
]

notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "notebook>=7.2",
    "ipywidgets>=8.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]